[package]
name = "zark-protocol"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
aes-gcm = "0.10"
ghash = "0.5"
aes = { version = "0.8", features = ["zeroize"] }
hkdf = "0.12"
k256 = { version = "0.13", features = ["arithmetic", "schnorr"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
zeroize = "1"
