[package]
name = "zark-spark-claim-mpc"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]
exclude = ["vendor/tandem"]
resolver = "3"

[dependencies]
anyhow = "1"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = "0.10"
hex = "0.4"
hkdf = "0.12"
k256 = { version = "0.13", features = ["arithmetic", "ecdh"] }
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tandem = { version = "=0.3.0", path = "vendor/tandem" }
# Tandem's published dependency predates Dalek's opt-in RNG feature.
curve25519-dalek = { version = "=4.1.3", features = ["rand_core"] }
zeroize = "1"

[package.metadata.tandem-source]
registry-version = "0.3.0"
crate-sha256 = "f10c3b5f176ef9008164b0a9c78238ef86e591adc1492d71ba367ae0b423859d"
# Dalek compatibility removes two extra basepoint-table references.
# states.rs additionally bounds deserialization while preserving the encoding.
# Crypto equations and wire formats remain upstream's.
compatibility-file = "vendor/tandem/src/ot_base.rs"
bounded-deserialization-file = "vendor/tandem/src/states.rs"

# Match consumers, which build this crate and its dependencies optimized in dev
# test builds; debug assertions remain enabled.
[profile.dev.package."*"]
opt-level = 3
[profile.dev.package.zark-spark-claim-mpc]
opt-level = 3
